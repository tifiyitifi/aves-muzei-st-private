name: Build custom APK

# Fork-only pipeline.
# - Only a push to the `release` branch builds the APK: it auto-tags `v<X.Y.Z>`,
#   extracts that section from CHANGELOG.md, and publishes a GitHub Release with
#   the APK and a SHA256 checksum file (idempotent: skipped when the tag exists).
# - Local development builds on the developer machine; CI is not a build farm.
# Other flavors stay in the upstream `release.yml`.
on:
  push:
    branches: [ "release" ]
    # Storage guard: the APK artifact has exactly one consumer, the `release` job
    # below. Every extra trigger built an APK nobody downloaded while
    # `upload-artifact` kept it for the repo default of 90 days -- a handful of
    # dev runs was enough to exhaust the account's 0.5 GB Actions storage quota.
    # Do not re-add dev branches; verify builds locally instead.
    #   branches: [ "muzei-dev", "release" ]
  # PR runs are not releases either and leak the same way, so keep this off.
  # pull_request:
  #   branches: [ "muzei-dev", "release" ]
  # Manual trigger is kept for re-running a failed build or a pre-release smoke
  # test. It costs nothing unless clicked, and by design it neither publishes a
  # release (the `release` job matches `push` only) nor uploads an artifact
  # (the upload matches `push` on `release` only).
  workflow_dispatch:

# A newer run on the same ref supersedes the older one: keeping both burns
# minutes on a full APK build whose result can no longer be published.
concurrency:
  group: build-custom-apk-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build_custom_apk:
    name: Custom APK
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Free disk space
        run: |
          # Split APKs plus native-lib merges can exhaust the stock runner.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean || true

      # Building relies on the Android Gradle plugin, which requires a modern
      # Java version (not the runner default).
      - name: Set up JDK for Android Gradle plugin
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decode and save keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks

      - name: Save signing properties
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            # Only add googleApiKey when provided, so `custom` maps stay disabled
            # ("NONE") instead of getting an empty key.
            if [ -n "${GOOGLE_API_KEY}" ]; then echo "googleApiKey=${GOOGLE_API_KEY}"; fi
          } > android/key.properties

      - name: Apply custom flavor
        run: scripts/apply_flavor_custom.sh

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Read app version
        id: ver
        run: |
          # pubspec version is the single source of truth; `+` is not filename-safe.
          raw=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)
          echo "value=${raw//+/_}" >> "$GITHUB_OUTPUT"

      - name: Build signed custom APK
        run: ./flutterw build apk --release -t lib/main_custom.dart --flavor custom

      # Release-only artifact. The guard mirrors the `release` job's `if:` verbatim,
      # so upload and download can never diverge; an unguarded upload would also
      # orphan a huge APK on every dev run. Rejected runs (cancelled, failed) store
      # nothing.
      # The previous unconditional steps are kept commented as a warning: with the
      # 90-day default retention they accumulated ~0.5 GB of dead APKs. If they are
      # ever revived, set an explicit short `retention-days` and re-check the
      # pinned action SHA, which goes stale while the lines stay commented.
      # - name: Collect artifact
      #   run: |
      #     mkdir -p outputs
      #     cp build/app/outputs/apk/custom/release/*.apk "outputs/aves-custom-${{ steps.ver.outputs.value }}.apk"
      #     ls -l outputs
      # - name: Upload APK
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: aves-custom-apk
      #     path: outputs/*.apk
      #     if-no-files-found: error

      - name: Collect artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: |
          mkdir -p outputs
          cp build/app/outputs/apk/custom/release/*.apk "outputs/aves-custom-${{ steps.ver.outputs.value }}.apk"
          ls -l outputs

      - name: Upload APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aves-custom-apk
          path: outputs/*.apk
          if-no-files-found: error
          # The `release` job consumes it in the same run, so one day is plenty;
          # the 90-day default is what accumulated the dead APKs.
          retention-days: 1

  release:
    name: GitHub release
    needs: [ build_custom_apk ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare tag name
        id: tag
        run: |
          # Release tag is v<X.Y.Z>; the `+N` build number is dropped.
          raw=$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)
          echo "name=v${raw%%+*}" >> "$GITHUB_OUTPUT"

      - name: Check tag
        id: check
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/${{ steps.tag.outputs.name }}")" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.check.outputs.exists == 'false'
        run: python3 scripts/extract_log.py "${{ steps.tag.outputs.name }}"

      - name: Download APK artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aves-custom-apk
          path: artifacts

      - name: Publish checksums
        if: steps.check.outputs.exists == 'false'
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          bodyFile: CHANGELOG_${{ steps.tag.outputs.name }}.md
          artifacts: "artifacts/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
